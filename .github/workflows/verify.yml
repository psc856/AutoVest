name: Verify execution and frontend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend dependencies
        run: python -m pip install -r requirements.production.txt -r requirements-dev.txt
      - name: Validate backend and real Redis atomicity
        env:
          TEST_REDIS_PORT: '6379'
        run: python -m unittest discover -s tests -v
      - name: Audit application Python dependencies
        run: python scripts/audit_python.py
      - run: npm ci
      - run: npm run test:frontend
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Build production image
        run: docker build --tag autoinvest-verified .
      - name: Build and validate same-origin web image
        run: |
          docker build --file Dockerfile.web --tag autoinvest-web-verified .
          docker run --rm --env APP_DOMAIN=invest.example.com autoinvest-web-verified caddy validate --config /etc/caddy/Caddyfile
